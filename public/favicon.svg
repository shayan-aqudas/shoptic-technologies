<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shoptic-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="glass-border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="24" cy="24" r="18" fill="url(#shoptic-grad)" opacity="0.3" filter="url(#glow)"/>

  <!-- Glass Hexagon Shell -->
  <rect x="5" y="5" width="38" height="38" rx="12" fill="#0A101D" fill-opacity="0.75" stroke="url(#glass-border)" stroke-width="1.5"/>

  <!-- Inner Dynamic S Tech Glyph -->
  <path d="M31 16C31 13.7909 29.2091 12 27 12H19C16.7909 12 15 13.7909 15 16C15 18.2091 16.7909 20 19 20H29C31.2091 20 33 21.7909 33 24C33 26.2091 31.2091 28 29 28H19C16.7909 28 15 29.7909 15 32C15 34.2091 16.7909 36 19 36H27C29.2091 36 31 34.2091 31 32" stroke="url(#shoptic-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Specular Lens Light Dot -->
  <circle cx="31" cy="16" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="17" cy="32" r="2" fill="#10B981" opacity="0.9"/>
</svg>
